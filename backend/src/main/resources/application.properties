# --- Server ---
server.port=${PORT:8080}

# --- Database (H2, file-based so data survives restarts) ---
# The DB file lives at ./data/guiltfree.mv.db relative to the working directory.
spring.datasource.url=jdbc:h2:file:./data/guiltfree;DB_CLOSE_ON_EXIT=FALSE

# Auto-create/update tables from the JPA entities. Fine for a single-user demo app.
spring.jpa.hibernate.ddl-auto=update

# --- Login ---
# One account, created on the first visit through the sign-up page (stored in the database,
# password hashed). After that, sign-up is closed and the login page is the only way in.

# --- CORS ---
# Comma-separated list of allowed frontend origins. Set FRONTEND_ORIGIN in production
# (e.g. your Vercel URL) via an environment variable; defaults cover local dev.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000}
